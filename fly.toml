# fly.toml app configuration file generated for fieldcraft-shreyash on 2026-08-05T21:50:55-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fieldcraft-shreyash'
primary_region = 'iad'

[build]
[env]
  FC_ALLOW_LIVE = '0'
  FC_BRIEFS_PER_HOUR = '10'
  FC_DAILY_COST_CAP_USD = '5'
  FC_DATA_DIR = '/data'
  FC_MAX_BUDGET_PER_RUN_USD = '1'
  FC_MAX_CONCURRENT = '4'
  FC_PYTEST_TIMEOUT_S = '30'

[[mounts]]
  source = 'fieldcraft_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '4s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
